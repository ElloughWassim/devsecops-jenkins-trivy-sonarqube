# Optional monitoring add-on (not part of the application deployment):
# exposes a Prometheus node-exporter installed with Helm in the "prometheus-node-exporter" namespace.
# See README.md > "Monitoring".
kind: Service
apiVersion: v1
metadata:
  name: node-exporter
  namespace: prometheus-node-exporter
spec:
  selector:
      app: node-exporter
  ports:
  - name: node-exporter
    protocol: TCP
    port: 9100
    targetPort: 9100
  type: NodePort