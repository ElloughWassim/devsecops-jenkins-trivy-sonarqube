name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Type check, build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
      - name: Dependency audit (fail on high/critical)
        run: yarn audit --groups dependencies --level high

  container:
    name: Docker image, smoke test and Trivy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Build image (dummy TMDB key: no real API calls in CI)
        run: docker build --build-arg TMDB_V3_API_KEY=ci-dummy-key -t movie-app:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 movie-app:ci
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/browse | grep -q '<div id="root">'
          docker rm -f app
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: movie-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy filesystem and IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: '1'

  manifests:
    name: Kubernetes validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary k8s/ monitoring/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
